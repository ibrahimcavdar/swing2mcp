name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # The end-to-end tests open the demo application, which needs a display.
      - run: xvfb-run -a mvn -B -ntp install
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-output
          path: |
            e2e-tests/target/surefire-reports/
            e2e-tests/target/*.log
